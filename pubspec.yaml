flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/map/
    - assets/new map for doogo dash/
    - assets/map/anim/
    - assets/map/tiles/
    - assets/maps/4x/
    - assets/maps/
    - assets/map/objects/
    - assets/music/
    - assets/sfx/
    - assets/audio/
    - assets/map/DogSpritee/
    - assets/map/DogSpritee/dead-Sheet.png
    - assets/map/DogSpritee/dead-Sheet.tsx
    - assets/map/DogSpritee/idel-Sheet.png
    - assets/map/DogSpritee/idel-Sheet.tsx
    - assets/map/DogSpritee/jump-Sheet.png
    - assets/map/DogSpritee/jump-Sheet.tsx
    - assets/map/DogSpritee/run.png
    - assets/map/DogSpritee/run.tsx
    - assets/map/enemies/
    - assets/map/enemies/enemey_final.png
    - assets/map/enemies/enemy_final.tsx
    - assets/map/enemies/owl_sprite.png
    - assets/map/enemies/owl_sprite.tsx
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/Fonts/LilitaOne-Regular.ttf
    - family: AltivoBlack
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-black.otf

    - family: altivoBlackItalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-blackitalic.otf

    - family: altivoBold
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-bold.otf

    - family: altivoBoldItalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-bolditalic.otf

    - family: altivoextralight
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-extralight.otf

    - family: altivoextralightitalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-extralightitalic.otf

    - family: altivoitalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-italic.otf

    - family: altivolight
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-light.otf
        - asset: assets/fonts/Fontspring-DEMO-altivo-lightitalic.otf

    - family: altivomedium
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-medium.otf

    - family: altivomediumitalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-mediumitalic.otf

    - family: altivoregular
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-regular.otf

    - family: altivothin
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-thin.otf

    - family: altivothinitalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-thinitalic.otf

    - family: altivoultra
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-ultra.otf

    - family: altivoultraitalic
      fonts:
        - asset: assets/fonts/Fontspring-DEMO-altivo-ultraitalic.otf



flutter_launcher_icons:
  android: true
  adaptive_icon_foreground: "./android_icon.png"
  adaptive_icon_background: "#5ec7db"
  min_sdk_android: 26
  image_path: './android_icon.png'
  ios: 'ios_icon.png'
  remove_alpha_ios: true
  web:
    generate: true
    image_path: 'android_icon.png'
    background_color: '#0046a3'
    theme_color: '#5ec7db'
  windows:
    generate: true
    image_path: 'android_icon.png'
    icon_size: 48
  macos:
    generate: true
    image_path: 'android_icon.png'

