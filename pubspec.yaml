name: super_dash
description: A Very Good Platformer Game generated by Very Good CLI.
version: 1.0.0+16
publish_to: none

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: 3.16.0

dependencies:
  app_ui:
    path: packages/app_ui
  audioplayers: ^5.2.0
  authentication_repository:
    path: packages/authentication_repository
  bloc: ^8.1.2
  cloud_firestore: ^4.15.6
  equatable: ^2.0.5
  file_selector: ^1.0.1
  firebase_analytics: ^10.10.7
  firebase_auth: ^4.17.6
  firebase_core: ^2.25.5
  flame: ^1.10.0
  flame_behaviors: ^1.0.0
  flame_tiled: ^1.14.0
  flow_builder: ^0.0.9
  video_player:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^10.6.0
  intl: ^0.19.0
  leaderboard_repository:
    path: packages/leaderboard_repository
  leap:
     path: packages/leap

  logging: ^1.2.0
  ordered_set: ^5.0.2
  path: ^1.8.3
  pathxp: ^0.4.0
  provider: ^6.0.5
  share_plus: ^7.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  change_app_package_name:
  firebase_database:
  firebase_crashlytics: ^3.5.7
  build_runner:
dev_dependencies:
  bloc_test: ^9.1.2
  flame_test: ^1.14.0
  flutter_launcher_icons: ^0.13.01
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
  very_good_analysis: ^5.0.0

#dependency_overrides:
#  flame_tiled:
